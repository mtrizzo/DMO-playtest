<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Cozy Village</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFF6E8">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="TemplateData/icons/icon-192.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingContainer = document.querySelector("#unity-loading-container");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/DMO-playtest-v2-build.loader.js";
      var config = {
        autoSyncPersistentDataPath: true,
        arguments: [],
        dataUrl: buildUrl + "/DMO-playtest-v2-build.data.unityweb",
        frameworkUrl: buildUrl + "/DMO-playtest-v2-build.framework.js.unityweb",
        codeUrl: buildUrl + "/DMO-playtest-v2-build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "DMO-2D-LetsPlay",
        productVersion: "v3 · e24b7459b",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // Small hands: no pull-down refresh, no pinch zoom, no long-press menu, no swipe back.
      document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      // Keep the screen awake while the game is open (where the browser allows it).
      var wakeLock = null;
      function keepAwake() {
        if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
        navigator.wakeLock.request('screen').then(function (lock) { wakeLock = lock; }).catch(function () {});
      }
      document.addEventListener('visibilitychange', keepAwake);
      keepAwake();



      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
